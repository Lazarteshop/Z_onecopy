<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Z-oneApp: Website Viewer & PPV Rewards</title>
    <meta name="monetag" content="11e081287c25e53b58eb8233ab78e674">
    
    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2196f3">
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Z-oneApp" />
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    
    <style>
      .install-btn {
        position: fixed;
        bottom: 75px;
        right: 20px;
        background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.15);
        padding: 12px 20px;
        border-radius: 9999px;
        font-weight: 800;
        cursor: pointer;
        display: none;
        z-index: 9999;
        box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.5), 0 8px 10px -6px rgba(99, 102, 241, 0.5);
        letter-spacing: -0.01em;
        transition: all 0.2s ease-in-out;
      }
      body.reels-widget-open {
        overflow: hidden !important;
        height: 100vh !important;
        overscroll-behavior: none !important;
      }
      body.user-logged-in #installBtn,
      body.user-logged-in .install-btn,
      body.reels-widget-open #installBtn,
      body.reels-widget-open .install-btn {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
      .reels-widget-scroll-container {
        touch-action: pan-y !important;
        overscroll-behavior: contain !important;
        -webkit-overflow-scrolling: touch !important;
      }
      .install-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 30px -5px rgba(99, 102, 241, 0.6);
      }
      .install-btn:active {
        transform: translateY(1px);
      }
    </style>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <div id="root"></div>
    <button id="installBtn" class="install-btn">Install App</button>
    <script type="module" src="src/main.tsx"></script>
    
    <!-- PWA Installation Script & Service Worker Registration -->
    <script>
      let deferredPrompt;
      const installBtn = document.getElementById("installBtn");

      let isDraggingBtn = false;
      let startX = 0, startY = 0, initialLeft = 0, initialTop = 0;

      function onStartDrag(e) {
        if (!installBtn) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const rect = installBtn.getBoundingClientRect();
        startX = clientX;
        startY = clientY;
        initialLeft = rect.left;
        initialTop = rect.top;
        isDraggingBtn = false;

        const onMove = (me) => {
          const moveX = me.touches ? me.touches[0].clientX : me.clientX;
          const moveY = me.touches ? me.touches[0].clientY : me.clientY;
          const dx = moveX - startX;
          const dy = moveY - startY;
          if (Math.hypot(dx, dy) > 5) {
            isDraggingBtn = true;
          }
          if (isDraggingBtn) {
            const newX = Math.min(Math.max(10, initialLeft + dx), window.innerWidth - rect.width - 10);
            const newY = Math.min(Math.max(10, initialTop + dy), window.innerHeight - rect.height - 10);
            installBtn.style.left = newX + "px";
            installBtn.style.top = newY + "px";
            installBtn.style.bottom = "auto";
            installBtn.style.right = "auto";
          }
        };

        const onEnd = () => {
          window.removeEventListener("mousemove", onMove);
          window.removeEventListener("mouseup", onEnd);
          window.removeEventListener("touchmove", onMove);
          window.removeEventListener("touchend", onEnd);
        };

        window.addEventListener("mousemove", onMove);
        window.addEventListener("mouseup", onEnd);
        window.addEventListener("touchmove", onMove, { passive: true });
        window.addEventListener("touchend", onEnd);
      }

      if (installBtn) {
        installBtn.addEventListener("mousedown", onStartDrag);
        installBtn.addEventListener("touchstart", onStartDrag, { passive: true });

        installBtn.addEventListener("click", (e) => {
          if (isDraggingBtn) {
            e.preventDefault();
            e.stopPropagation();
            isDraggingBtn = false;
            return;
          }
          window.location.href = "appstore.html";
        });
      }

      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;
        if (!document.body.classList.contains('user-logged-in') && installBtn) {
          installBtn.style.display = "block";
        }
      });

      window.addEventListener("load", () => {
        setTimeout(() => {
          if (!deferredPrompt && !document.body.classList.contains('user-logged-in') && installBtn) {
            installBtn.style.display = "block";
            installBtn.innerText = "Install App 📱";
          }
        }, 3000);
      });

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js")
          .then(() => console.log("SW registered"))
          .catch(err => console.log("SW failed", err));
      }
    </script>
  </body>
</html>
