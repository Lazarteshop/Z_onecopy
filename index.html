    <!-- PWA Installation Script & Service Worker Registration -->
    <script>
      let deferredPrompt;
      const installBtn = document.getElementById("installBtn");

      let isDraggingBtn = false;
      let startX = 0, startY = 0, initialLeft = 0, initialTop = 0;

      function onStartDrag(e) {
        if (!installBtn) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const rect = installBtn.getBoundingClientRect();
        startX = clientX;
        startY = clientY;
        initialLeft = rect.left;
        initialTop = rect.top;
        isDraggingBtn = false;

        const onMove = (me) => {
          const moveX = me.touches ? me.touches[0].clientX : me.clientX;
          const moveY = me.touches ? me.touches[0].clientY : me.clientY;
          const dx = moveX - startX;
          const dy = moveY - startY;
          if (Math.hypot(dx, dy) > 5) {
            isDraggingBtn = true;
          }
          if (isDraggingBtn) {
            const newX = Math.min(Math.max(10, initialLeft + dx), window.innerWidth - rect.width - 10);
            const newY = Math.min(Math.max(10, initialTop + dy), window.innerHeight - rect.height - 10);
            installBtn.style.left = newX + "px";
            installBtn.style.top = newY + "px";
            installBtn.style.bottom = "auto";
            installBtn.style.right = "auto";
          }
        };

        const onEnd = () => {
          window.removeEventListener("mousemove", onMove);
          window.removeEventListener("mouseup", onEnd);
          window.removeEventListener("touchmove", onMove);
          window.removeEventListener("touchend", onEnd);
        };

        window.addEventListener("mousemove", onMove);
        window.addEventListener("mouseup", onEnd);
        window.addEventListener("touchmove", onMove, { passive: true });
        window.addEventListener("touchend", onEnd);
      }

      if (installBtn) {
        installBtn.addEventListener("mousedown", onStartDrag);
        installBtn.addEventListener("touchstart", onStartDrag, { passive: true });

        installBtn.addEventListener("click", (e) => {
          if (isDraggingBtn) {
            e.preventDefault();
            e.stopPropagation();
            isDraggingBtn = false;
            return;
          }
          window.location.href = "appstore.html";
        });
      }

      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;
        if (!document.body.classList.contains('user-logged-in') && installBtn) {
          installBtn.style.display = "block";
        }
      });

      window.addEventListener("load", () => {
        setTimeout(() => {
          if (!deferredPrompt && !document.body.classList.contains('user-logged-in') && installBtn) {
            installBtn.style.display = "block";
            installBtn.innerText = "Install App 📱";
          }
        }, 3000);
      });

      if ("serviceWorker" in navigator) {
        let isRefreshing = false;
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (!isRefreshing) {
            isRefreshing = true;
            console.log("SW: New service worker active, updating page...");
            window.location.reload();
          }
        });

        navigator.serviceWorker.register("sw.js")
          .then((reg) => {
            console.log("SW registered");

            // Check for update immediately
            reg.update().catch(() => {});

            // If a new worker is waiting, tell it to activate
            if (reg.waiting) {
              reg.waiting.postMessage({ type: 'SKIP_WAITING' });
            }

            reg.addEventListener("updatefound", () => {
              const newWorker = reg.installing;
              if (newWorker) {
                newWorker.addEventListener("statechange", () => {
                  if (newWorker.state === "installed" && navigator.serviceWorker.controller) {
                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                  }
                });
              }
            });

            // Check for updates when user returns to app
            document.addEventListener("visibilitychange", () => {
              if (document.visibilityState === "visible") {
                reg.update().catch(() => {});
              }
            });

            // Check for updates every 3 minutes
            setInterval(() => {
              reg.update().catch(() => {});
            }, 180000);
          })
          .catch((err) => console.log("SW registration failed:", err));
      }
    </script>
