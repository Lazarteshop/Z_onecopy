    <style>
      .install-btn {
        position: fixed;

    <!-- Global Early Error Handler -->
    <script>
      window.addEventListener('error', function(e) {
        console.error('Global Unhandled Window Error:', e.error || e.message);
        var root = document.getElementById('root');
        if (root && (!root.firstElementChild || root.querySelector('#initial-app-loader'))) {
          root.innerHTML = '<div style="min-height:100vh;background:#090d16;color:#fff;padding:24px;display:flex;align-items:center;justify-content:center;font-family:sans-serif;">' +
            '<div style="max-width:480px;background:#1e293b;border:1px solid #334155;border-radius:12px;padding:20px;text-align:center;">' +
              '<h3 style="color:#ef4444;margin-top:0;">⚡ Error Loading Preview</h3>' +
              '<p style="font-size:13px;color:#cbd5e1;">' + (e.message || 'Script execution interrupted') + '</p>' +
              '<button onclick="window.location.reload()" style="background:#2563eb;color:#fff;border:none;padding:10px 18px;border-radius:6px;font-weight:bold;cursor:pointer;margin-top:10px;">🔄 Reload Page</button>' +
            '</div></div>';
        }
      });
    </script>

    <button id="installBtn" class="install-btn">Install App</button>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- PWA Installation & Service Worker Manager -->
    <script>
      let deferredPrompt;
      const installBtn = document.getElementById("installBtn");

      let isDraggingBtn = false;
      let startX = 0, startY = 0, initialLeft = 0, initialTop = 0;

      function onStartDrag(e) {
        if (!installBtn) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const rect = installBtn.getBoundingClientRect();
        startX = clientX;
        startY = clientY;
        initialLeft = rect.left;
        initialTop = rect.top;
        isDraggingBtn = false;

        const onMove = (me) => {
          const moveX = me.touches ? me.touches[0].clientX : me.clientX;
          const moveY = me.touches ? me.touches[0].clientY : me.clientY;
          const dx = moveX - startX;
          const dy = moveY - startY;
          if (Math.hypot(dx, dy) > 5) {
            isDraggingBtn = true;
          }
          if (isDraggingBtn) {
            const newX = Math.min(Math.max(10, initialLeft + dx), window.innerWidth - rect.width - 10);
            const newY = Math.min(Math.max(10, initialTop + dy), window.innerHeight - rect.height - 10);
            installBtn.style.left = newX + "px";
            installBtn.style.top = newY + "px";
            installBtn.style.bottom = "auto";
            installBtn.style.right = "auto";
          }
        };

        const onEnd = () => {
          window.removeEventListener("mousemove", onMove);
          window.removeEventListener("mouseup", onEnd);
          window.removeEventListener("touchmove", onMove);
          window.removeEventListener("touchend", onEnd);
        };

        window.addEventListener("mousemove", onMove);
        window.addEventListener("mouseup", onEnd);
        window.addEventListener("touchmove", onMove, { passive: true });
        window.addEventListener("touchend", onEnd);
      }

      if (installBtn) {
        installBtn.addEventListener("mousedown", onStartDrag);
        installBtn.addEventListener("touchstart", onStartDrag, { passive: true });

        installBtn.addEventListener("click", (e) => {
          if (isDraggingBtn) {
            e.preventDefault();
            e.stopPropagation();
            isDraggingBtn = false;
            return;
          }
          window.location.href = "appstore.html";
        });
      }

      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;
        if (!document.body.classList.contains('user-logged-in') && installBtn) {
          installBtn.style.display = "block";
        }
      });

      // Manage Service Worker registration safely
      if ("serviceWorker" in navigator) {
        const isPreviewOrDev = 
          window.self !== window.top ||
          window.location.hostname.includes('run.app') ||
          window.location.hostname.includes('localhost') ||
          window.location.hostname.includes('127.0.0.1') ||
          window.location.port === '3000';

        if (isPreviewOrDev) {
          // AI Studio Preview / Dev Environment: Unregister SW & clear caches to prevent stale cache conflicts
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (const registration of registrations) {
              registration.unregister().then(() => {
                console.log("SW: Unregistered active service worker in AI Studio Preview for fresh live updates.");
              });
            }
          }).catch(() => {});

          if (window.caches) {
            caches.keys().then((keys) => {
              keys.forEach((key) => {
                if (key.includes('zone-') || key.includes('v13') || key.includes('app')) {
                  caches.delete(key);
                }
              });
            }).catch(() => {});
          }
        } else {
          // Production Domain (e.g. z-oneapp.onrender.com)
          let isRefreshing = false;
          navigator.serviceWorker.addEventListener("controllerchange", () => {
            if (!isRefreshing) {
              isRefreshing = true;
              console.log("SW: New service worker active, updating page...");
              window.location.reload();
            }
          });

          navigator.serviceWorker.register("/sw.js")
            .then((reg) => {
              console.log("SW registered");
              reg.update().catch(() => {});
              if (reg.waiting) {
                reg.waiting.postMessage({ type: 'SKIP_WAITING' });
              }
              reg.addEventListener("updatefound", () => {
                const newWorker = reg.installing;
                if (newWorker) {
                  newWorker.addEventListener("statechange", () => {
                    if (newWorker.state === "installed" && navigator.serviceWorker.controller) {
                      newWorker.postMessage({ type: 'SKIP_WAITING' });
                    }
                  });
                }
              });
            })
            .catch((err) => console.log("SW registration skipped/failed:", err));
        }
      }
    </script>
